<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${usuarios.id_usuario == null}
            ? 'SoftBecx - safe to pay | Registrar Usuario'
            : 'SoftBecx - safe to pay | Editar Usuario'">
        SoftBecx - safe to pay
    </title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/usuario-form.css}">
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

<!-- Encabezado -->
<header class="bg-slate-900 shadow-lg">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
        <div>
            <h1 class="text-2xl font-bold text-white"
                th:text="${usuarios.id_usuario == null} ? 'Registrar Usuario' : 'Editar Usuario'">
                Formulario Usuario
            </h1>
            <p class="mt-1 text-sm text-slate-300"
               th:text="${usuarios.id_usuario == null} ? 'Complete la información para crear un nuevo usuario.' : 'Actualice la información del usuario seleccionado.'">
                Complete la información del usuario.
            </p>
        </div>

        <div class="hidden rounded-full bg-blue-500/20 px-4 py-2 text-sm font-medium text-blue-300 md:block">
            <span>SoftBecx - safe to pay</span>
        </div>
    </div>
</header>

<!-- Contenido principal -->
<main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8">

    <!-- Tarjeta principal -->
    <section class="overflow-hidden rounded-2xl bg-white shadow-lg">

        <!-- Encabezado del formulario -->
        <div class="border-b border-slate-200 bg-slate-50 px-6 py-5 sm:px-8">
            <div class="flex items-center gap-4">
                <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 text-blue-700">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-7 w-7">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Información del usuario</h2>
                    <p class="mt-1 text-sm text-slate-500">Los campos marcados con <span class="font-bold text-red-500">*</span> son obligatorios.</p>
                </div>
            </div>
        </div>

        <!-- Formulario -->
        <form th:action="@{/view/usuarios/save}" th:object="${usuarios}" method="post" class="p-6 sm:p-8">

            <input type="hidden" th:field="*{id_usuario}">

            <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

                <!-- Documento -->
                <div>
                    <label for="documento" class="mb-2 block text-sm font-semibold text-slate-700">Documento <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6.75-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.169.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.337 0Z"/>
                            </svg>
                        </div>
                        <input type="number" id="documento" th:field="*{documento}" placeholder="Ejemplo: 1112345678" min="1" required class="form-input w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                    </div>
                </div>

                <!-- Rol -->
                <div>
                    <label for="rol" class="mb-2 block text-sm font-semibold text-slate-700">Rol <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                            </svg>
                        </div>
                        <select id="rol" th:field="*{rol}" required class="form-input w-full appearance-none rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-10 text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                            <option value="">Seleccione un rol</option>
                            <option value="1">Administrador</option>
                            <option value="2">Empleado</option>
                            <option value="3">Cliente</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Nombre -->
                <div>
                    <label for="nombre" class="mb-2 block text-sm font-semibold text-slate-700">Nombre <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
                            </svg>
                        </div>
                        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre" minlength="2" maxlength="60" required class="form-input w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                    </div>
                </div>

                <!-- Apellido -->
                <div>
                    <label for="apellido" class="mb-2 block text-sm font-semibold text-slate-700">Apellido <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM6.75 12a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5ZM15 13.5a6 6 0 0 0-6 6h12a6 6 0 0 0-6-6ZM6.75 13.5a5.25 5.25 0 0 0-5.25 5.25h5.625a7.458 7.458 0 0 1 1.178-3.628A5.225 5.225 0 0 0 6.75 13.5Z"/>
                            </svg>
                        </div>
                        <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ingrese el apellido" minlength="2" maxlength="60" required class="form-input w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                    </div>
                </div>

                <!-- Correo -->
                <div>
                    <label for="correo" class="mb-2 block text-sm font-semibold text-slate-700">Correo electrónico <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5A2.25 2.25 0 0 1 19.5 19.5h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0-9.75 6.75-9.75-6.75"/>
                            </svg>
                        </div>
                        <input type="email" id="correo" th:field="*{correo}" placeholder="usuario@correo.com" maxlength="100" required class="form-input w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                    </div>
                </div>

                <!-- Teléfono -->
                <div>
                    <label for="telefono" class="mb-2 block text-sm font-semibold text-slate-700">Teléfono <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25A2.25 2.25 0 0 0 21.75 19.5v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106a1.125 1.125 0 0 0-1.173.417l-.97 1.293a1.125 1.125 0 0 1-1.21.38 12.035 12.035 0 0 1-7.143-7.143 1.125 1.125 0 0 1 .38-1.21l1.293-.97c.36-.27.527-.734.417-1.173L6.963 3.102A1.125 1.125 0 0 0 5.872 2.25H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/>
                            </svg>
                        </div>
                        <input type="tel" id="telefono" th:field="*{telefono}" placeholder="Ejemplo: 3101234567" minlength="7" maxlength="20" required class="form-input w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="md:col-span-2">
                    <label for="contrasena" class="mb-2 block text-sm font-semibold text-slate-700">Contraseña <span th:if="${usuarios.id_usuario == null}" class="text-red-500">*</span></label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                            </svg>
                        </div>
                        <input type="password" id="contrasena" th:field="*{contrasena}" placeholder="Ingrese la contraseña" minlength="6" th:required="${usuarios.id_usuario == null}" class="form-input w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-14 text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                        <button type="button" onclick="alternarContrasena()" class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-400 transition hover:text-blue-600" aria-label="Mostrar u ocultar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.575 3.007 9.963 7.178.07.207.07.431 0 .638C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.575-3.007-9.964-7.178Z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                            </svg>
                        </button>
                    </div>
                    <div th:if="${usuarios.id_usuario != null}" class="mt-3 flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="mt-0.5 h-5 w-5 flex-shrink-0">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
                        </svg>
                        <span>Deje este campo vacío para conservar la contraseña actual.</span>
                    </div>
                </div>

            </div>

            <!-- Botones de Acción -->
            <div class="mt-8 flex flex-col-reverse gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:justify-end">

                <!-- Botón Menú Principal -->
                <a th:href="@{/}"
                   class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                    Menú Principal
                </a>

                <!-- Botón Volver a la Lista -->
                <a th:href="@{/view/usuarios}"
                   class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
                    </svg>
                    Ver Lista
                </a>

                <!-- Botón Submit -->
                <button type="submit"
                        class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m6 2.25a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                    </svg>
                    <span th:text="${usuarios.id_usuario == null} ? 'Registrar usuario' : 'Guardar cambios'">Guardar</span>
                </button>

            </div>

        </form>

    </section>

</main>

<!-- Pie de página -->
<footer class="mt-8 border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-7xl px-6 py-5 text-center text-sm text-slate-500">
        SoftBecx - safe to pay &copy; <span th:text="${#dates.year(#dates.createNow())}"></span>
    </div>
</footer>

<!-- JS personalizado -->
<script th:src="@{/js/script.js}"></script>

<script>
    function alternarContrasena() {
        const input = document.getElementById("contrasena");
        if (input) {
            input.type = input.type === "password" ? "text" : "password";
        }
    }
</script>

</body>
</html>
